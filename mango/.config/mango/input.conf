
# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Monitors
monitor_rule=name:eDP-1,width:1920,height:1200,refresh:110,x:0,y:0
